<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recent golden hours · CMU Skyline</title>
<style>
  :root{--bg:#0b0d12;--grad:#141d31;--panel:#111622;--panel2:#161c2a;--line:#232b3d;
    --ink:#f0f4fb;--dim:#8a97b0;--dimmer:#5b6577;--amber:#ffb64a;--sky:#66cdff;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1300px 820px at 72% -12%,var(--grad),var(--bg) 58%);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;padding:28px}
  header{max-width:1100px;margin:0 auto 20px}
  h1{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--dim);font-family:var(--mono);font-size:.82rem;margin-top:5px}
  .sub a{color:var(--sky);text-decoration:none}
  #days{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .day{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:16px;padding:16px 18px}
  .date{font-family:var(--mono);font-size:.82rem;color:var(--amber);letter-spacing:.06em;margin-bottom:12px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cell{border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line);position:relative}
  .cell.empty{background:var(--panel);min-height:150px;display:flex;align-items:center;justify-content:center;
    color:var(--dimmer);font-family:var(--mono);font-size:.8rem}
  .cell img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
  .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 12px;font-family:var(--mono)}
  .lbl{font-size:.82rem;color:var(--ink);font-weight:600}
  .lbl .w{color:var(--amber)}
  .st{font-size:.68rem;color:var(--dimmer);text-align:right}
  .empty-state{color:var(--dim);font-family:var(--mono);text-align:center;padding:40px}
  @media(max-width:640px){.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Recent golden hours</h1>
  <div class="sub">CMU Skyline Monitor · the inferred peak-golden frame for each morning &amp; evening · <a href="dashboard.html">live dashboard ↗</a></div>
</header>
<div id="days"><div class="empty-state">loading…</div></div>
<script>
const SANTAFE="https://sites.santafe.edu/~simon/";
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function fmtDate(d){ try{ return new Date(d+'T12:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}); }catch(e){ return d; } }
function cell(label,e){
  if(!e) return `<div class="cell empty">${label} · —</div>`;
  const st=[]; if(e.sun_elev!=null)st.push(`sun ${e.sun_elev}°`);
  if(e.sky_hue!=null)st.push(`sky ${e.sky_hue}°${e.sky_hue_name?' '+e.sky_hue_name:''}`);
  return `<div class="cell"><img loading="lazy" src="${SANTAFE+e.file}" alt="${label} golden hour">
    <div class="meta"><span class="lbl"><span class="w">${label}</span> · ${e.time||''}</span>
      <span class="st">${st.join(' · ')}</span></div></div>`;
}
function render(idx){
  if(!idx||!idx.length){ document.getElementById('days').innerHTML='<div class="empty-state">No golden hours recorded yet — check back after the next sunrise or sunset.</div>'; return; }
  const byDate={};
  idx.forEach(e=>{ (byDate[e.date]=byDate[e.date]||{})[e.which]=e; });
  const dates=Object.keys(byDate).sort().reverse();
  document.getElementById('days').innerHTML=dates.map(d=>
    `<div class="day"><div class="date">${fmtDate(d)}</div>
      <div class="pair">${cell('Morning',byDate[d].morning)}${cell('Evening',byDate[d].evening)}</div></div>`
  ).join('');
}
(function(){
  const s=document.createElement('script');
  s.src=SANTAFE+'goldindex.js?_='+Date.now();
  s.onload=()=>{ render(window.GOLDINDEX||[]); };
  s.onerror=()=>{ render([]); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
